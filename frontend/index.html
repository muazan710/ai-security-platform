<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Security Intelligence Platform</title>
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <!-- Header -->
      <div class="auth-header">
        <h1>🛡️ AI Security Intelligence Platform</h1>
        <p>Secure Login &amp; User Authentication</p>
      </div>

      <!-- Tabs -->
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login" onclick="switchTab('login')">Login</button>
        <button class="auth-tab" data-tab="signup" onclick="switchTab('signup')">Sign Up</button>
        <button class="auth-tab" data-tab="verify" onclick="switchTab('verify')">Verify</button>
        <button class="auth-tab" data-tab="reset" onclick="switchTab('reset')">Reset</button>
      </div>

      <!-- Login Form -->
      <form class="auth-form active" id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="loginPassword">Password</label>
          <div class="password-wrapper">
            <input type="password" id="loginPassword" placeholder="Enter your password" required>
            <button type="button" class="toggle-password" onclick="togglePassword('loginPassword')">👁️</button>
          </div>
        </div>
        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" id="rememberMe">
            <span>Remember Me</span>
          </label>
          <button type="button" class="link-button" onclick="switchTab('reset')">Forgot password?</button>
        </div>
        <button type="submit" class="btn-primary">Login</button>
        <div id="loginMessage" class="form-message"></div>
      </form>

      <!-- Signup Form -->
      <form class="auth-form" id="signupForm" onsubmit="handleSignup(event)">
        <div class="form-group">
          <label for="signupName">Full Name</label>
          <input type="text" id="signupName" placeholder="John Doe" required>
        </div>
        <div class="form-group">
          <label for="signupEmail">Email</label>
          <input type="email" id="signupEmail" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="signupPassword">Password</label>
          <div class="password-wrapper">
            <input type="password" id="signupPassword" placeholder="Minimum 8 characters" required>
            <button type="button" class="toggle-password" onclick="togglePassword('signupPassword')">👁️</button>
          </div>
        </div>
        <div class="form-group">
          <label for="signupConfirmPassword">Confirm Password</label>
          <div class="password-wrapper">
            <input type="password" id="signupConfirmPassword" placeholder="Confirm your password" required>
            <button type="button" class="toggle-password" onclick="togglePassword('signupConfirmPassword')">👁️</button>
          </div>
        </div>
        <button type="submit" class="btn-primary">Create Account</button>
        <div id="signupMessage" class="form-message"></div>
      </form>

      <!-- Email Verification Form -->
      <form class="auth-form" id="verifyForm" onsubmit="handleVerifyEmail(event)">
        <div class="form-group">
          <label for="verifyEmail">Email</label>
          <input type="email" id="verifyEmail" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="verifyOtp">Verification Code</label>
          <input type="text" id="verifyOtp" inputmode="numeric" maxlength="6" placeholder="6-digit code" required>
        </div>
        <button type="submit" class="btn-primary">Verify Email</button>
        <button type="button" class="link-button full-width" onclick="handleResendOtp(event)">Resend code</button>
        <div id="verifyMessage" class="form-message"></div>
      </form>

      <!-- Password Reset Form -->
      <form class="auth-form" id="resetForm" onsubmit="handleResetPassword(event)">
        <div class="form-group">
          <label for="resetEmail">Email</label>
          <input type="email" id="resetEmail" placeholder="you@example.com" required>
        </div>
        <button type="button" class="btn-primary" id="forgotPasswordButton" onclick="handleForgotPassword(event)">Send Reset Code</button>
        <div class="form-group">
          <label for="resetOtp">Reset Code</label>
          <input type="text" id="resetOtp" inputmode="numeric" maxlength="6" placeholder="6-digit code" required>
        </div>
        <div class="form-group">
          <label for="resetPassword">New Password</label>
          <div class="password-wrapper">
            <input type="password" id="resetPassword" placeholder="New password" required>
            <button type="button" class="toggle-password" onclick="togglePassword('resetPassword')">Show</button>
          </div>
        </div>
        <button type="submit" class="btn-primary">Reset Password</button>
        <div id="resetMessage" class="form-message"></div>
      </form>

      <!-- Footer -->
      <div class="auth-footer">
        <p>AI Security Intelligence Platform</p>
        <p class="version" id="backendVersion">Version loading...</p>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
