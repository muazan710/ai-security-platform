services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aisecurity}
      POSTGRES_USER: ${POSTGRES_USER:-aisecurity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aisecurity_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aisecurity} -d ${POSTGRES_DB:-aisecurity}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_VERSION: ${APP_VERSION:-2.0.0}
      DATABASE_URL: postgresql://${POSTGRES_USER:-aisecurity}:${POSTGRES_PASSWORD:-aisecurity_password}@postgres:5432/${POSTGRES_DB:-aisecurity}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      SENDER_EMAIL: ${SENDER_EMAIL:-}
      SENDER_NAME: ${SENDER_NAME:-AI Security Platform}
    command: ["sh", "-c", "alembic -c /app/alembic.ini upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 20s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

  mcp:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "mcp_server.py", "--http", "--host", "0.0.0.0", "--port", "8010"]
    environment:
      BACKEND_URL: http://backend:8000
      MCP_API_KEY: ${MCP_API_KEY:-}
      APP_VERSION: ${APP_VERSION:-2.0.0}
    ports:
      - "8010:8010"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=5).read()"]
      interval: 20s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
