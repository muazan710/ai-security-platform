name: Notify Private Deploy Repo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger private repository deploy workflow
        env:
          DISPATCH_TOKEN: ${{ secrets.PRIVATE_REPO_DISPATCH_TOKEN }}
          PRIVATE_REPO: AhtishamHussain/ai-security-platform
          PROJECT_REPO: muazan710/ai-security-platform
          PROJECT_SHA: ${{ github.sha }}
          PROJECT_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${DISPATCH_TOKEN}" ]; then
            echo "::error::Missing PRIVATE_REPO_DISPATCH_TOKEN secret in public repo."
            exit 1
          fi

          payload="$(cat <<EOF
          {
            "event_type": "app_updated",
            "client_payload": {
              "repository": "${PROJECT_REPO}",
              "ref": "${PROJECT_REF}",
              "sha": "${PROJECT_SHA}"
            }
          }
          EOF
          )"

          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${PRIVATE_REPO}/dispatches" \
            -d "${payload}"
